<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuego - Fórmula 1 al Amanecer</title>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        #panel-control {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 20, 10, 0.8); /* Tono verdoso oscuro */
            color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #00ff44; /* Verde Racing */
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        #panel-control h1 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: #00ff44;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-style: italic; /* Toque de velocidad */
        }

        #panel-control p {
            margin: 5px 0;
            font-size: 1rem;
            color: #e0e0e0;
        }

        .tecla {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid #00ff44;
            padding: 3px 8px;
            border-radius: 5px;
            color: #88ffaa;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="panel-control">
        <h1>SIMULADOR F1</h1>
        <p>Acelerar: <span class="tecla">⬆️ Arriba</span></p>
        <p>Frenar/Reversa: <span class="tecla">⬇️ Abajo</span></p>
        <p>Girar: <span class="tecla">⬅️ Izq</span> / <span class="tecla">➡️ Der</span></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. CONFIGURACIÓN BÁSICA Y SOMBRAS (Mantenemos el amanecer realista)
        const escena = new THREE.Scene();
        const colorCielo = 0xff7b54;  
        const colorNiebla = 0xff9a76; 
        
        escena.background = new THREE.Color(colorCielo);
        escena.fog = new THREE.FogExp2(colorNiebla, 0.005); 
        
        const camara = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderizador = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderizador.setSize(window.innerWidth, window.innerHeight);
        renderizador.shadowMap.enabled = true;
        renderizador.shadowMap.type = THREE.PCFSoftShadowMap; 
        renderizador.outputEncoding = THREE.sRGBEncoding; 
        document.body.appendChild(renderizador.domElement);

        // 2. ILUMINACIÓN AVANZADA
        const luzHemisferio = new THREE.HemisphereLight(0xffb347, 0x2b2b2b, 0.5);
        escena.add(luzHemisferio);
        
        const luzSol = new THREE.DirectionalLight(0xff8c00, 1.5);
        luzSol.position.set(100, 40, -100); 
        luzSol.castShadow = true;
        luzSol.shadow.camera.left = -150;
        luzSol.shadow.camera.right = 150;
        luzSol.shadow.camera.top = 150;
        luzSol.shadow.camera.bottom = -150;
        luzSol.shadow.mapSize.width = 2048; 
        luzSol.shadow.mapSize.height = 2048;
        luzSol.shadow.bias = -0.0005; 
        escena.add(luzSol);

        // 3. CONSTRUCCIÓN DEL FÓRMULA 1 (Verde Racing)
        const coche = new THREE.Group();
        
        // Materiales del F1
        const matVerde = new THREE.MeshStandardMaterial({ color: 0x008822, roughness: 0.2, metalness: 0.5 });
        const matNegro = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const matGoma = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });

        // Trompa (Parte delantera estrecha)
        const trompaGeo = new THREE.BoxGeometry(0.6, 0.3, 2);
        const trompa = new THREE.Mesh(trompaGeo, matVerde);
        trompa.position.set(0, 0.25, -1.5);
        trompa.castShadow = true;
        trompa.receiveShadow = true;
        coche.add(trompa);

        // Motor y Cabina (Parte central/trasera más ancha)
        const cuerpoGeo = new THREE.BoxGeometry(1.2, 0.5, 2.5);
        const cuerpo = new THREE.Mesh(cuerpoGeo, matVerde);
        cuerpo.position.set(0, 0.35, 0.75);
        cuerpo.castShadow = true;
        cuerpo.receiveShadow = true;
        coche.add(cuerpo);
        
        // Casco del piloto (Pequeño detalle negro en la cabina)
        const cascoGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const casco = new THREE.Mesh(cascoGeo, matNegro);
        casco.position.set(0, 0.7, 0.2);
        coche.add(casco);

        // Alerón Delantero
        const aleronDelGeo = new THREE.BoxGeometry(2.2, 0.05, 0.5);
        const aleronDel = new THREE.Mesh(aleronDelGeo, matVerde);
        aleronDel.position.set(0, 0.15, -2.5);
        aleronDel.castShadow = true;
        coche.add(aleronDel);

        // Alerón Trasero
        const aleronTrasGeo = new THREE.BoxGeometry(2, 0.05, 0.7);
        const aleronTras = new THREE.Mesh(aleronTrasGeo, matVerde);
        aleronTras.position.set(0, 0.9, 1.8);
        aleronTras.castShadow = true;
        coche.add(aleronTras);
        
        // Soporte del alerón trasero
        const soporteGeo = new THREE.BoxGeometry(0.2, 0.5, 0.2);
        const soporte = new THREE.Mesh(soporteGeo, matNegro);
        soporte.position.set(0, 0.6, 1.8);
        coche.add(soporte);

        // Ruedas expuestas estilo F1
        function crearRuedaF1(x, z) {
            const ruedaGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            const rueda = new THREE.Mesh(ruedaGeo, matGoma);
            rueda.rotation.z = Math.PI / 2;
            rueda.position.set(x, 0.4, z);
            rueda.castShadow = true;
            coche.add(rueda);
        }
        
        crearRuedaF1(1.1, -1.6); // Delantera derecha
        crearRuedaF1(-1.1, -1.6); // Delantera izquierda
        crearRuedaF1(1.1, 1.4); // Trasera derecha
        crearRuedaF1(-1.1, 1.4); // Trasera izquierda

        escena.add(coche);

        // 4. GENERACIÓN DE LA CIUDAD Y CARRETERA
        
        // Suelo base (Cimientos de la ciudad)
        const sueloGeo = new THREE.PlaneGeometry(2000, 2000);
        const sueloMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.8 });
        const suelo = new THREE.Mesh(sueloGeo, sueloMat);
        suelo.rotation.x = -Math.PI / 2; 
        suelo.receiveShadow = true; 
        escena.add(suelo);

        // La Carretera (Asfalto liso y más oscuro en el centro)
        const carreteraGeo = new THREE.PlaneGeometry(20, 2000);
        const carreteraMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.4, metalness: 0.1 });
        const carretera = new THREE.Mesh(carreteraGeo, carreteraMat);
        carretera.rotation.x = -Math.PI / 2;
        carretera.position.y = 0.01; // Ligeramente encima del suelo para que se vea
        carretera.receiveShadow = true;
        escena.add(carretera);

        // Líneas divisorias de la carretera
        const lineasGeo = new THREE.PlaneGeometry(0.4, 4);
        const lineasMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for(let i = -1000; i < 1000; i += 10) {
            const linea = new THREE.Mesh(lineasGeo, lineasMat);
            linea.rotation.x = -Math.PI / 2;
            linea.position.set(0, 0.02, i); // Justo encima de la carretera
            escena.add(linea);
        }

        // Generador de Edificios
        const ciudad = new THREE.Group();
        const bloqueEdificioGeo = new THREE.BoxGeometry(1, 1, 1);
        bloqueEdificioGeo.translate(0, 0.5, 0); 
        const coloresEdificios = [0x555555, 0x777777, 0x444455, 0x665555];

        for(let i = 0; i < 350; i++) {
            const colorAleatorio = coloresEdificios[Math.floor(Math.random() * coloresEdificios.length)];
            const edificioMat = new THREE.MeshStandardMaterial({ color: colorAleatorio, roughness: 0.7 });
            const edificio = new THREE.Mesh(bloqueEdificioGeo, edificioMat);
            
            const ancho = 10 + Math.random() * 25;
            const alto = 20 + Math.random() * 80; 
            const profundo = 10 + Math.random() * 25;
            edificio.scale.set(ancho, alto, profundo);

            let posX = (Math.random() - 0.5) * 800;
            let posZ = (Math.random() - 0.5) * 800;
            
            // Empujamos los edificios hacia los lados para dejar libre la carretera de 20m de ancho
            if (Math.abs(posX) < 18) {
                posX += (posX > 0 ? 18 : -18);
            }

            edificio.position.set(posX, 0, posZ);
            edificio.castShadow = true;
            edificio.receiveShadow = true;
            ciudad.add(edificio);
        }
        escena.add(ciudad);

        // 5. CONTROLES DEL TECLADO
        const teclas = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => {
            if (teclas.hasOwnProperty(e.code)) teclas[e.code] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (teclas.hasOwnProperty(e.code)) teclas[e.code] = false;
        });

        // 6. FÍSICA Y MOVIMIENTO (Ajustado para F1 - Mucho más rápido)
        let velocidad = 0;
        const aceleracion = 0.015; // Arranca más rápido
        const velocidadMaxima = 1.2; // Doble de velocidad punta
        let anguloDireccion = 0;

        function animar() {
            requestAnimationFrame(animar);

            if (teclas.ArrowUp) {
                velocidad -= aceleracion; 
            } else if (teclas.ArrowDown) {
                velocidad += aceleracion;
            } else {
                velocidad *= 0.97; // Fricción más baja (aerodinámica)
            }

            velocidad = Math.max(Math.min(velocidad, velocidadMaxima), -velocidadMaxima);

            if (Math.abs(velocidad) > 0.01) {
                if (teclas.ArrowLeft) anguloDireccion += 0.05 * (velocidad < 0 ? 1 : -1); // Gira más rápido
                if (teclas.ArrowRight) anguloDireccion -= 0.05 * (velocidad < 0 ? 1 : -1);
            }

            coche.rotation.y = anguloDireccion;
            coche.position.z += Math.cos(anguloDireccion) * velocidad;
            coche.position.x += Math.sin(anguloDireccion) * velocidad;

            // 7. CÁMARA SEGUIDORA (Más baja para sentir la velocidad)
            camara.position.x = coche.position.x + Math.sin(anguloDireccion) * 12; 
            camara.position.z = coche.position.z + Math.cos(anguloDireccion) * 12;
            camara.position.y = 4; // Cámara más pegada al suelo
            camara.lookAt(coche.position);

            renderizador.render(escena, camara);
        }

        window.addEventListener('resize', () => {
            camara.aspect = window.innerWidth / window.innerHeight;
            camara.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });

        animar();
    </script>
</body>
</html>
