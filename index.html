<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minijuego - F1 Bogotá (Versión Optimizada)</title>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #8fa3b8; 
            touch-action: none;
        }

        #panel-control {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 30, 40, 0.85);
            color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #cc0000; 
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #panel-control h1 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            color: #ffcc00; 
            text-transform: uppercase;
        }

        #panel-control p { margin: 0; font-size: 0.9rem; color: #ddd; }

        #controles-tactiles {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 200;
        }

        .grupo-botones { display: flex; gap: 10px; }

        .btn-tactil {
            background: rgba(204, 0, 0, 0.2);
            border: 2px solid rgba(204, 0, 0, 0.6);
            color: white;
            font-size: 24px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn-tactil:active, .btn-tactil.presionado {
            background: rgba(204, 0, 0, 0.8);
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            #panel-control { display: none; }
            .btn-tactil { width: 55px; height: 55px; font-size: 20px; }
        }
    </style>
</head>
<body>

    <div id="panel-control">
        <h1>BOGOTÁ RACING</h1>
        <p>Versión Ligera</p>
    </div>

    <div id="controles-tactiles">
        <div class="grupo-botones">
            <div class="btn-tactil" id="btn-izq">⬅️</div>
            <div class="btn-tactil" id="btn-der">➡️</div>
        </div>
        <div class="grupo-botones">
            <div class="btn-tactil" id="btn-freno">⬇️</div>
            <div class="btn-tactil" id="btn-acelerar">⬆️</div>
        </div>
    </div>

    <!-- Cargamos Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. CONFIGURACIÓN OPTIMIZADA
        const escena = new THREE.Scene();
        escena.background = new THREE.Color(0x8fa3b8);
        escena.fog = new THREE.Fog(0x8fa3b8, 20, 300); // Niebla más eficiente para móviles
        
        const camara = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 800);
        
        const renderizador = new THREE.WebGLRenderer({ antialias: false }); // Antialias en false para más FPS en celular
        renderizador.setSize(window.innerWidth, window.innerHeight);
        renderizador.shadowMap.enabled = true;
        renderizador.shadowMap.type = THREE.BasicShadowMap; // Sombras básicas para no trabar el dispositivo
        document.body.appendChild(renderizador.domElement);

        const luzHemisferio = new THREE.HemisphereLight(0xffffff, 0x555566, 0.7);
        escena.add(luzHemisferio);
        
        const luzSol = new THREE.DirectionalLight(0xffeedd, 0.8);
        luzSol.position.set(100, 150, -100); 
        luzSol.castShadow = true;
        luzSol.shadow.camera.left = -150; luzSol.shadow.camera.right = 150;
        luzSol.shadow.camera.top = 150; luzSol.shadow.camera.bottom = -150;
        luzSol.shadow.mapSize.width = 512; // Textura de sombra reducida
        luzSol.shadow.mapSize.height = 512;
        escena.add(luzSol);

        const limitesColisiones = [];

        // 2. CONSTRUCCIÓN DEL FÓRMULA 1 (Verde fosforescente para verlo fácil)
        const coche = new THREE.Group();
        const matVerde = new THREE.MeshStandardMaterial({ color: 0x00ff44, roughness: 0.2, metalness: 0.5 });
        const matNegro = new THREE.MeshStandardMaterial({ color: 0x111111 });

        const trompa = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 2), matVerde);
        trompa.position.set(0, 0.25, -1.5); trompa.castShadow = true; coche.add(trompa);

        const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 2.5), matVerde);
        cuerpo.position.set(0, 0.35, 0.75); cuerpo.castShadow = true; coche.add(cuerpo);
        
        const aleronDel = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.05, 0.5), matVerde);
        aleronDel.position.set(0, 0.15, -2.5); coche.add(aleronDel);

        const aleronTras = new THREE.Mesh(new THREE.BoxGeometry(2, 0.05, 0.7), matVerde);
        aleronTras.position.set(0, 0.9, 1.8); coche.add(aleronTras);

        function crearRuedaF1(x, z) {
            const rueda = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16), matNegro);
            rueda.rotation.z = Math.PI / 2; rueda.position.set(x, 0.4, z);
            rueda.castShadow = true; coche.add(rueda);
        }
        crearRuedaF1(1.1, -1.6); crearRuedaF1(-1.1, -1.6);
        crearRuedaF1(1.1, 1.4); crearRuedaF1(-1.1, 1.4);
        
        coche.position.set(8, 0.1, 0); // Lo ponemos a la derecha y un poco elevado para evitar que se hunda
        escena.add(coche);

        // 3. LA CALLE Y EL CARRIL EXCLUSIVO
        const suelo = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: 0x2b2b2b }));
        suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; escena.add(suelo);

        const carretera = new THREE.Mesh(new THREE.PlaneGeometry(40, 1000), new THREE.MeshStandardMaterial({ color: 0x151515 }));
        carretera.rotation.x = -Math.PI / 2; carretera.position.y = 0.01; escena.add(carretera);

        const carrilTM = new THREE.Mesh(new THREE.PlaneGeometry(8, 1000), new THREE.MeshStandardMaterial({ color: 0x8b1c1c }));
        carrilTM.rotation.x = -Math.PI / 2; carrilTM.position.y = 0.02; escena.add(carrilTM);

        // Líneas amarillas optimizadas (menos objetos = más fluidez)
        const lineaGeo = new THREE.PlaneGeometry(0.3, 15); // Líneas mucho más largas
        const lineaMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        for(let i = -500; i < 100; i += 30) { 
            const lineaIzq = new THREE.Mesh(lineaGeo, lineaMat);
            lineaIzq.rotation.x = -Math.PI / 2; lineaIzq.position.set(-4.2, 0.03, i);
            escena.add(lineaIzq);
            
            const lineaDer = new THREE.Mesh(lineaGeo, lineaMat);
            lineaDer.rotation.x = -Math.PI / 2; lineaDer.position.set(4.2, 0.03, i);
            escena.add(lineaDer);
        }

        // 4. GENERADOR DE TRANSMILENIOS LIGERO
        function crearTransMilenio(posZ) {
            const tmGroup = new THREE.Group();
            const matRojoTM = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
            
            // Vagones más sencillos
            const vagon1 = new THREE.Mesh(new THREE.BoxGeometry(3.5, 3.5, 10), matRojoTM);
            vagon1.position.set(0, 1.75, -6); vagon1.castShadow = true;
            
            const vagon2 = new THREE.Mesh(new THREE.BoxGeometry(3.5, 3.5, 10), matRojoTM);
            vagon2.position.set(0, 1.75, 6); vagon2.castShadow = true;

            const fuelle = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3.2, 2), new THREE.MeshStandardMaterial({ color: 0x444444 }));
            fuelle.position.set(0, 1.75, 0);

            tmGroup.add(vagon1, fuelle, vagon2);
            tmGroup.position.set(0, 0, posZ);
            escena.add(tmGroup);

            limitesColisiones.push({
                minX: -3.25, maxX: 3.25,
                minZ: posZ - 12.5, maxZ: posZ + 12.5
            });
        }

        crearTransMilenio(-80);
        crearTransMilenio(-300);
        crearTransMilenio(-550);

        // 5. EDIFICIOS OPTIMIZADOS (Solo 60 en vez de 500)
        const ciudad = new THREE.Group();
        const bloqueGeo = new THREE.BoxGeometry(1, 1, 1);
        bloqueGeo.translate(0, 0.5, 0); 
        const coloresBogota = [0x8b3a3a, 0xa55142, 0x555555, 0xaaaaaa];

        // Torre Colpatria
        const colpatria = new THREE.Mesh(new THREE.BoxGeometry(18, 120, 18), new THREE.MeshStandardMaterial({ color: 0xdddddd }));
        colpatria.position.set(-45, 0, -150); colpatria.castShadow = true;
        escena.add(colpatria);
        
        limitesColisiones.push({
            minX: -56.5, maxX: -33.5, minZ: -161.5, maxZ: -138.5
        });

        for(let i = 0; i < 60; i++) {
            const edificio = new THREE.Mesh(bloqueGeo, new THREE.MeshStandardMaterial({ color: coloresBogota[Math.floor(Math.random() * coloresBogota.length)] }));
            const ancho = 15 + Math.random() * 20;
            const profundo = 15 + Math.random() * 20;
            edificio.scale.set(ancho, 20 + Math.random() * 60, profundo);

            let posX = (Math.random() - 0.5) * 600;
            let posZ = (Math.random() - 0.5) * 600;
            
            const zonaSegura = 22 + (ancho / 2); 
            if (Math.abs(posX) < zonaSegura) {
                posX = posX > 0 ? zonaSegura : -zonaSegura;
            }
            if (posX > 150) posX -= 300; // Evitar cerros

            edificio.position.set(posX, 0, posZ);
            edificio.castShadow = true; 
            ciudad.add(edificio);

            limitesColisiones.push({
                minX: posX - (ancho / 2) - 2.5, maxX: posX + (ancho / 2) + 2.5,
                minZ: posZ - (profundo / 2) - 2.5, maxZ: posZ + (profundo / 2) + 2.5
            });
        }
        escena.add(ciudad);

        // 6. CONTROLES Y EVENTOS
        const teclas = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => { if(teclas.hasOwnProperty(e.code)) teclas[e.code] = true; });
        window.addEventListener('keyup', (e) => { if(teclas.hasOwnProperty(e.code)) teclas[e.code] = false; });

        function conectarBotonTactil(idBoton, codigoTecla) {
            const btn = document.getElementById(idBoton);
            if(!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); teclas[codigoTecla] = true; btn.classList.add('presionado'); }, {passive: false});
            btn.addEventListener('touchend', (e) => { e.preventDefault(); teclas[codigoTecla] = false; btn.classList.remove('presionado'); });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); teclas[codigoTecla] = true; btn.classList.add('presionado'); });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); teclas[codigoTecla] = false; btn.classList.remove('presionado'); });
            btn.addEventListener('mouseleave', (e) => { teclas[codigoTecla] = false; btn.classList.remove('presionado'); });
        }

        conectarBotonTactil('btn-acelerar', 'ArrowUp');
        conectarBotonTactil('btn-freno', 'ArrowDown');
        conectarBotonTactil('btn-izq', 'ArrowLeft');
        conectarBotonTactil('btn-der', 'ArrowRight');

        // 7. FÍSICA Y ANIMACIÓN
        let velocidad = 0;
        let anguloDireccion = 0;

        function animar() {
            requestAnimationFrame(animar);

            if (teclas.ArrowUp) velocidad -= 0.015; 
            else if (teclas.ArrowDown) velocidad += 0.015;
            else velocidad *= 0.96;

            velocidad = Math.max(Math.min(velocidad, 1.2), -1.2);

            if (Math.abs(velocidad) > 0.01) {
                if (teclas.ArrowLeft) anguloDireccion += 0.05 * (velocidad < 0 ? 1 : -1);
                if (teclas.ArrowRight) anguloDireccion -= 0.05 * (velocidad < 0 ? 1 : -1);
            }

            const posicionPreviaX = coche.position.x;
            const posicionPreviaZ = coche.position.z;

            coche.rotation.y = anguloDireccion;
            coche.position.z += Math.cos(anguloDireccion) * velocidad;
            coche.position.x += Math.sin(anguloDireccion) * velocidad;

            // Colisiones seguras
            let choco = false;
            for(let i = 0; i < limitesColisiones.length; i++) {
                let limite = limitesColisiones[i];
                if (coche.position.x > limite.minX && coche.position.x < limite.maxX &&
                    coche.position.z > limite.minZ && coche.position.z < limite.maxZ) {
                    choco = true;
                    break;
                }
            }

            if (choco) {
                coche.position.x = posicionPreviaX;
                coche.position.z = posicionPreviaZ;
                velocidad = 0; 
            }

            // Cámara sigue al coche firmemente
            camara.position.x = coche.position.x + Math.sin(anguloDireccion) * 12; 
            camara.position.z = coche.position.z + Math.cos(anguloDireccion) * 12;
            camara.position.y = 4.5;
            camara.lookAt(coche.position);

            renderizador.render(escena, camara);
        }

        window.addEventListener('resize', () => {
            camara.aspect = window.innerWidth / window.innerHeight;
            camara.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });

        // Iniciar el juego
        animar();
    </script>
</body>
</html>
