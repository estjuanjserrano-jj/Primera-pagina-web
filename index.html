<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minijuego - F1 en Bogotá (Realista)</title>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #8fa3b8; /* Gris azulado sabanero */
            touch-action: none;
        }

        #panel-control {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 30, 40, 0.85);
            color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #cc0000; /* Rojo TransMilenio */
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #panel-control h1 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            color: #ffcc00; /* Amarillo Bogotá */
            text-transform: uppercase;
            font-weight: bold;
        }

        #panel-control p { margin: 0; font-size: 0.9rem; color: #ddd; }

        #controles-tactiles {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 200;
        }

        .grupo-botones { display: flex; gap: 10px; }

        .btn-tactil {
            background: rgba(204, 0, 0, 0.2);
            border: 2px solid rgba(204, 0, 0, 0.6);
            color: white;
            font-size: 24px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.1s;
        }

        .btn-tactil:active, .btn-tactil.presionado {
            background: rgba(204, 0, 0, 0.8);
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            #panel-control { display: none; }
            .btn-tactil { width: 55px; height: 55px; font-size: 20px; }
        }
    </style>
</head>
<body>

    <div id="panel-control">
        <h1>BOGOTÁ RACING</h1>
        <p>Acelera por el carril exclusivo</p>
    </div>

    <div id="controles-tactiles">
        <div class="grupo-botones">
            <div class="btn-tactil" id="btn-izq">⬅️</div>
            <div class="btn-tactil" id="btn-der">➡️</div>
        </div>
        <div class="grupo-botones">
            <div class="btn-tactil" id="btn-freno">⬇️</div>
            <div class="btn-tactil" id="btn-acelerar">⬆️</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. CONFIGURACIÓN DEL ENTORNO (Clima frío, cielo gris sabanero)
        const escena = new THREE.Scene();
        const colorCielo = 0x8fa3b8; 
        const colorNiebla = 0x9bb0c4; 
        
        escena.background = new THREE.Color(colorCielo);
        escena.fog = new THREE.FogExp2(colorNiebla, 0.003); 
        
        const camara = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderizador = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderizador.setSize(window.innerWidth, window.innerHeight);
        renderizador.shadowMap.enabled = true;
        renderizador.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderizador.domElement);

        // ILUMINACIÓN (Luz difusa de día nublado)
        const luzHemisferio = new THREE.HemisphereLight(0xffffff, 0x555566, 0.7);
        escena.add(luzHemisferio);
        
        const luzSol = new THREE.DirectionalLight(0xffeedd, 0.8);
        luzSol.position.set(200, 150, -200); 
        luzSol.castShadow = true;
        luzSol.shadow.camera.left = -300; luzSol.shadow.camera.right = 300;
        luzSol.shadow.camera.top = 300; luzSol.shadow.camera.bottom = -300;
        luzSol.shadow.mapSize.width = 2048;
        luzSol.shadow.mapSize.height = 2048;
        escena.add(luzSol);

        // 2. CONSTRUCCIÓN DEL COCHE F1
        const coche = new THREE.Group();
        const matVerde = new THREE.MeshStandardMaterial({ color: 0x008822, roughness: 0.2 });
        const matNegro = new THREE.MeshStandardMaterial({ color: 0x111111 });

        const trompa = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 2), matVerde);
        trompa.position.set(0, 0.25, -1.5); trompa.castShadow = true; coche.add(trompa);

        const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 2.5), matVerde);
        cuerpo.position.set(0, 0.35, 0.75); cuerpo.castShadow = true; coche.add(cuerpo);
        
        const aleronDel = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.05, 0.5), matVerde);
        aleronDel.position.set(0, 0.15, -2.5); coche.add(aleronDel);

        const aleronTras = new THREE.Mesh(new THREE.BoxGeometry(2, 0.05, 0.7), matVerde);
        aleronTras.position.set(0, 0.9, 1.8); coche.add(aleronTras);

        function crearRuedaF1(x, z) {
            const rueda = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16), matNegro);
            rueda.rotation.z = Math.PI / 2; rueda.position.set(x, 0.4, z);
            rueda.castShadow = true; coche.add(rueda);
        }
        crearRuedaF1(1.1, -1.6); crearRuedaF1(-1.1, -1.6);
        crearRuedaF1(1.1, 1.4); crearRuedaF1(-1.1, 1.4);
        
        // Iniciamos el coche en el carril de TransMilenio
        coche.position.x = 0;
        escena.add(coche);

        // 3. GENERACIÓN DE LA CIUDAD ESTILO BOGOTÁ
        const limitesEdificios = [];
        
        // Suelo
        const suelo = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: 0x2b2b2b }));
        suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; escena.add(suelo);

        // Carretera Mixta (Asfalto negro)
        const carretera = new THREE.Mesh(new THREE.PlaneGeometry(30, 3000), new THREE.MeshStandardMaterial({ color: 0x151515 }));
        carretera.rotation.x = -Math.PI / 2; carretera.position.y = 0.01; escena.add(carretera);

        // Carril Exclusivo TransMilenio (Rojo)
        const carrilTM = new THREE.Mesh(new THREE.PlaneGeometry(8, 3000), new THREE.MeshStandardMaterial({ color: 0x8b1c1c, roughness: 0.8 }));
        carrilTM.rotation.x = -Math.PI / 2; carrilTM.position.y = 0.02; escena.add(carrilTM);

        // Separadores amarillos (Pistones o líneas)
        const lineaGeo = new THREE.PlaneGeometry(0.3, 4);
        const lineaMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 }); // Amarillo
        for(let i = -1500; i < 1500; i += 8) {
            const lineaIzq = new THREE.Mesh(lineaGeo, lineaMat);
            lineaIzq.rotation.x = -Math.PI / 2; lineaIzq.position.set(-4.2, 0.03, i);
            escena.add(lineaIzq);
            
            const lineaDer = new THREE.Mesh(lineaGeo, lineaMat);
            lineaDer.rotation.x = -Math.PI / 2; lineaDer.position.set(4.2, 0.03, i);
            escena.add(lineaDer);
        }

        // --- EDIFICIOS ICÓNICOS ---
        
        // Torre Colpatria
        const colpatriaMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.3 });
        const colpatria = new THREE.Mesh(new THREE.BoxGeometry(18, 160, 18), colpatriaMat);
        colpatria.position.set(-45, 80, -200); // Lado izquierdo de la vía
        colpatria.castShadow = true; colpatria.receiveShadow = true;
        escena.add(colpatria);
        
        limitesEdificios.push({
            minX: -45 - 9 - 2.5, maxX: -45 + 9 + 2.5,
            minZ: -200 - 9 - 2.5, maxZ: -200 + 9 + 2.5
        });

        // --- EDIFICIOS GENÉRICOS (Ladrillo) ---
        const ciudad = new THREE.Group();
        const bloqueGeo = new THREE.BoxGeometry(1, 1, 1);
        bloqueGeo.translate(0, 0.5, 0); 
        
        const coloresBogota = [0x8b3a3a, 0xa55142, 0x9c4a3d, 0x555555, 0x404040, 0xaaaaaa, 0x7a3a29];

        for(let i = 0; i < 500; i++) {
            const edificioMat = new THREE.MeshStandardMaterial({ 
                color: coloresBogota[Math.floor(Math.random() * coloresBogota.length)], 
                roughness: 0.9 
            });
            const edificio = new THREE.Mesh(bloqueGeo, edificioMat);
            
            const ancho = 12 + Math.random() * 25;
            const profundo = 12 + Math.random() * 25;
            const alto = 15 + Math.random() * (Math.random() > 0.85 ? 100 : 50); 
            edificio.scale.set(ancho, alto, profundo);

            let posX = (Math.random() - 0.5) * 1200;
            let posZ = (Math.random() - 0.5) * 1200;
            
            // Dejamos libre la avenida principal (30m de ancho)
            if (Math.abs(posX) < 25) posX += (posX > 0 ? 25 : -25);
            // Alejamos los edificios de la Torre Colpatria
            if (Math.abs(posX - (-45)) < 30 && Math.abs(posZ - (-200)) < 30) continue; 
            // No ponemos edificios en los cerros (Derecha)
            if (posX > 300) posX -= 500;

            edificio.position.set(posX, 0, posZ);
            edificio.castShadow = true; edificio.receiveShadow = true;
            ciudad.add(edificio);

            limitesEdificios.push({
                minX: posX - (ancho / 2) - 2.5, maxX: posX + (ancho / 2) + 2.5,
                minZ: posZ - (profundo / 2) - 2.5, maxZ: posZ + (profundo / 2) + 2.5
            });
        }
        escena.add(ciudad);

        // 4. LOS CERROS ORIENTALES Y MONSERRATE
        const cerros = new THREE.Group();
        const matCerros = new THREE.MeshStandardMaterial({ color: 0x1f3d14, roughness: 1.0 }); // Verde bosque
        const geometriaCerro = new THREE.ConeGeometry(1, 1, 16);
        geometriaCerro.translate(0, 0.5, 0);

        for(let i = -1000; i < 1000; i += 100) {
            const cerro = new THREE.Mesh(geometriaCerro, matCerros);
            const radio = 150 + Math.random() * 200;
            const altura = 300 + Math.random() * 300; // Muy altos
            cerro.scale.set(radio, altura, radio);
            
            // Posicionamos a la derecha
            let posZ = i + (Math.random() - 0.5) * 100;
            cerro.position.set(500 + Math.random() * 100, 0, posZ);
            cerro.castShadow = true;
            cerros.add(cerro);

            // Colocamos Monserrate en uno de los cerros específicos
            if (i === -200) {
                const monserrate = new THREE.Mesh(
                    new THREE.BoxGeometry(20, 25, 30), 
                    new THREE.MeshStandardMaterial({ color: 0xffffff }) // Santuario Blanco
                );
                monserrate.position.set(500, altura - 10, posZ);
                escena.add(monserrate);
            }
        }
        escena.add(cerros);

        // 5. CONTROLES Y EVENTOS
        const teclas = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => { if(teclas.hasOwnProperty(e.code)) teclas[e.code] = true; });
        window.addEventListener('keyup', (e) => { if(teclas.hasOwnProperty(e.code)) teclas[e.code] = false; });

        function conectarBotonTactil(idBoton, codigoTecla) {
            const btn = document.getElementById(idBoton);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); teclas[codigoTecla] = true; btn.classList.add('presionado'); }, {passive: false});
            btn.addEventListener('touchend', (e) => { e.preventDefault(); teclas[codigoTecla] = false; btn.classList.remove('presionado'); });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); teclas[codigoTecla] = true; btn.classList.add('presionado'); });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); teclas[codigoTecla] = false; btn.classList.remove('presionado'); });
            btn.addEventListener('mouseleave', (e) => { teclas[codigoTecla] = false; btn.classList.remove('presionado'); });
        }

        conectarBotonTactil('btn-acelerar', 'ArrowUp');
        conectarBotonTactil('btn-freno', 'ArrowDown');
        conectarBotonTactil('btn-izq', 'ArrowLeft');
        conectarBotonTactil('btn-der', 'ArrowRight');

        // 6. FÍSICA Y ANIMACIÓN
        let velocidad = 0;
        let anguloDireccion = 0;

        function animar() {
            requestAnimationFrame(animar);

            if (teclas.ArrowUp) velocidad -= 0.015; 
            else if (teclas.ArrowDown) velocidad += 0.015;
            else velocidad *= 0.97;

            velocidad = Math.max(Math.min(velocidad, 1.2), -1.2);

            if (Math.abs(velocidad) > 0.01) {
                if (teclas.ArrowLeft) anguloDireccion += 0.05 * (velocidad < 0 ? 1 : -1);
                if (teclas.ArrowRight) anguloDireccion -= 0.05 * (velocidad < 0 ? 1 : -1);
            }

            const posicionPreviaX = coche.position.x;
            const posicionPreviaZ = coche.position.z;

            coche.rotation.y = anguloDireccion;
            coche.position.z += Math.cos(anguloDireccion) * velocidad;
            coche.position.x += Math.sin(anguloDireccion) * velocidad;

            // Colisiones con edificios y torre Colpatria
            let choco = false;
            for(let i = 0; i < limitesEdificios.length; i++) {
                let limite = limitesEdificios[i];
                if (coche.position.x > limite.minX && coche.position.x < limite.maxX &&
                    coche.position.z > limite.minZ && coche.position.z < limite.maxZ) {
                    choco = true;
                    break;
                }
            }

            // Muro invisible en los cerros orientales
            if (coche.position.x > 350) choco = true;

            if (choco) {
                coche.position.x = posicionPreviaX;
                coche.position.z = posicionPreviaZ;
                velocidad = 0; 
            }

            // CÁMARA
            camara.position.x = coche.position.x + Math.sin(anguloDireccion) * 12; 
            camara.position.z = coche.position.z + Math.cos(anguloDireccion) * 12;
            camara.position.y = 4.5;
            camara.lookAt(coche.position);

            renderizador.render(escena, camara);
        }

        window.addEventListener('resize', () => {
            camara.aspect = window.innerWidth / window.innerHeight;
            camara.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });

        animar();
    </script>
</body>
</html>
